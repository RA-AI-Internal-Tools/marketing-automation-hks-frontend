server {
    listen 80;
    server_name _;

    # Use Docker internal DNS so compose service names resolve
    resolver 127.0.0.11 valid=10s ipv6=off;

    # LOAD-BEARING: `api` must match the compose service name of the Go backend
    # exactly. Because proxy_pass uses a variable, nginx resolves this at
    # REQUEST time via the resolver above instead of failing at startup — so a
    # wrong name does not break `nginx -t` or the container boot. It fails
    # silently at runtime with 502s.
    #
    # This is not hypothetical. The dual-env split renamed the service to
    # `api-sandbox` / `api-production`; this file kept saying `api`, and every
    # proxied location below — /api/, /internal/, /webhooks/ and /healthz —
    # 502'd for 78 days.
    #
    # Worse, it broke SILENTLY: the container healthcheck in docker-compose
    # probes `http://127.0.0.1/`, which `location /` serves off local disk and
    # never touches the proxy. So the container stayed GREEN the entire time
    # while every proxied route was dead. Do not treat a healthy frontend
    # container as evidence that its proxy targets resolve.
    #
    # If you ever rename the backend service in docker-compose, change it here
    # in the same commit.
    set $backend_api http://api:8080;

    # DO NOT add `auth_basic` / `auth_basic_user_file` to this file. The live
    # host once had a hand-edited copy of this config with basic auth pointing
    # at /etc/nginx/.htpasswd — a file the Dockerfile never COPYs into the
    # image. Building an image from such a tree gives nginx a missing password
    # file, so every request under the guarded scope 401s (or 500s). At server
    # level that includes the `/` the container healthcheck probes, so the
    # container never becomes healthy and `depends_on` blocks the rollout.
    # Put access control on the host/edge nginx, not in this image.

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Must match internal/middleware/security.go's CSP. Browsers
    # intersect multiple CSP headers; a tighter one here would override
    # the Go-side grants (that's how we got font-awesome blocked even
    # after opening the backend CSP for it). Keep in lockstep.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache static assets aggressively (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE proxy — disable buffering and keep long-lived streaming connections open
    location /api/sse {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # API proxy to Go backend
    location /api/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Internal service-to-service endpoints (Tracardi → MA sync)
    location /internal/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_read_timeout 30s;
    }

    # Webhooks proxy
    location /webhooks/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_read_timeout 30s;
    }

    # Health endpoint proxy
    location /healthz {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
