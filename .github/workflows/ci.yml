name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs FIRST, deliberately: it establishes that the type-check below
      # means something before that type-check is allowed to report green.
      # Two arms, both proven to fail when violated:
      #   A. no project-less `--noEmit` type-check anywhere in package.json
      #      or these workflows (see the comment on the next step);
      #   B. every source file on disk is claimed by a project referenced
      #      from tsconfig.json. Arm B is what would have caught the real
      #      historical defect: all 38 spec files plus src/test-setup.ts
      #      belonged to no project, so `--build` walked past them and a
      #      planted type error in a spec still exited 0.
      - name: Type-check guard (prove the type-check is not vacuous)
        run: npm run type-check:guard

      - name: Type check
        # NOT --noEmit: this repo's root tsconfig.json is solution-style
        # (`"files": []` + `references`), so `vue-tsc --noEmit` matches zero
        # input files and exits 0 unconditionally regardless of real type
        # errors. `--build` follows the project references and is what
        # `npm run type-check` (called from `npm run build` below) actually
        # runs — this step must use the same command or it is not checking
        # anything.
        #
        # `references` now covers four projects, not two: tsconfig.node.json
        # (*.config.ts), tsconfig.app.json (env.d.ts + src, minus tests),
        # tsconfig.vitest.json (the spec files + src/test-setup.ts) and
        # tsconfig.e2e.json (e2e/**). This one command checks all of them.
        run: npx vue-tsc --build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Best-effort checkout of the backend repo so
      # logStatusVocabulary.spec.ts's `backendVocabulary` block can compare
      # LOG_STATUSES against internal/model/campaign.go. This is read-only
      # access to a second private repo, which GITHUB_TOKEN cannot grant
      # (it is scoped to this repository only) — hence the separate
      # MA_BACKEND_RO_TOKEN secret. continue-on-error is deliberate: a
      # missing/unconfigured token must degrade this one guard, not fail
      # the whole unit-test job.
      #
      # No `ref:` is pinned above, so this always checks out the backend's
      # default-branch HEAD — the drift guard therefore compares against
      # whatever is live on that branch right now, not a fixed commit. An
      # unrelated backend commit landing on its default branch can flip an
      # otherwise-unchanged frontend PR from green to red; that is inherent
      # to a cross-repo drift guard, not a frontend regression, so do not
      # read a newly-red run here as "something broke in this PR" without
      # first checking what changed on the backend's default branch.
      #
      # `path` MUST resolve to a location under $GITHUB_WORKSPACE:
      # actions/checkout@v4 validates `path` (input-helper.ts resolves it
      # against githubWorkspacePath and throws if the result does not start
      # with githubWorkspacePath + sep) before doing any auth or network
      # work at all. `../marketing-automation-hks` resolves to a sibling of
      # the workspace directory, not something inside it, so that form
      # throws on every run regardless of the token — continue-on-error
      # then just swallows that guaranteed failure. `backend-repo` (a
      # subdirectory of the already-checked-out workspace) is the fix. It
      # is safe to check out here: `npm ci` above only reads package.json/
      # lockfile, vitest's `include` is scoped to `src/**/*.{test,spec}.
      # {ts,tsx}` so nothing under backend-repo/ is ever collected as a
      # test file, and actions/checkout's default clean only runs `git
      # clean` inside the path it was given, not the parent workspace — it
      # will not touch the frontend checkout next to it.
      - name: Checkout backend repo (for cross-repo LogStatus drift guard)
        id: backend_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: RA-AI-Internal-Tools/marketing-automation-hks
          token: ${{ secrets.MA_BACKEND_RO_TOKEN }}
          path: backend-repo

      # Make the outcome visible in both the Actions UI (::warning::) and
      # the job log, and only wire MA_BACKEND_REPO up when the checkout
      # actually succeeded — never let this guard silently disappear.
      #
      # The warning deliberately does NOT claim that configuring
      # MA_BACKEND_RO_TOKEN is sufficient on its own: an empty/unset secret
      # is one possible cause of a failed checkout, but a configured secret
      # can still fail (wrong permissions, revoked token, repo renamed,
      # transient network error) — `repository:` is pinned to
      # RA-AI-Internal-Tools/marketing-automation-hks and checkout always
      # sends the token as an `AUTHORIZATION: basic` header, so an empty
      # token cannot silently check out the wrong repo, it just fails the
      # authenticated fetch. We can cheaply tell "no secret configured"
      # apart from "secret configured but checkout still failed" (without
      # printing the secret itself), so the warning does that and points at
      # the checkout step's own log for the exact error in the second case.
      #
      # One case this two-branch message gets wrong: on a pull_request run
      # from a FORK, the secrets context is entirely empty regardless of
      # what is actually configured on this repo, so
      # `secrets.MA_BACKEND_RO_TOKEN != ''` is false and the message below
      # will claim "not configured" even when the secret exists. This is
      # effectively unreachable here — this is a private repo, so
      # collaborators push branches directly rather than forking — but if
      # that ever changes, do not trust the "not configured" branch of this
      # message on a fork-originated run.
      - name: Report backend-sync guard status
        env:
          BACKEND_TOKEN_SET: ${{ secrets.MA_BACKEND_RO_TOKEN != '' }}
        run: |
          if [ "${{ steps.backend_checkout.outcome }}" = "success" ]; then
            echo "MA_BACKEND_REPO=${{ github.workspace }}/backend-repo" >> "$GITHUB_ENV"
            echo "Backend repo checked out — LogStatus drift guard is LIVE this run."
          else
            if [ "$BACKEND_TOKEN_SET" = "true" ]; then
              REASON="MA_BACKEND_RO_TOKEN is configured but the checkout step still failed anyway (bad/expired token, missing read access to RA-AI-Internal-Tools/marketing-automation-hks, or a network error) — see the 'Checkout backend repo' step's own log above for the exact error, adding the secret again will not fix this by itself."
            else
              REASON="MA_BACKEND_RO_TOKEN is not configured (empty/unset) — set it to a fine-grained PAT with Contents:Read on RA-AI-Internal-Tools/marketing-automation-hks (or a classic PAT with 'repo' scope), stored as the MA_BACKEND_RO_TOKEN secret. An SSH deploy key will NOT work here: checkout's token: input is HTTPS basic auth only."
            fi
            echo "::warning::Backend repo checkout failed — the LOG_STATUSES <-> internal/model/campaign.go cross-repo drift guard (logStatusVocabulary.spec.ts, 'backendVocabulary') is SKIPPED this run, not checked. $REASON"
            echo "MA_SKIP_BACKEND_SYNC=1" >> "$GITHUB_ENV"
          fi

      # `--coverage` is deliberate. vitest.config.ts has carried coverage
      # thresholds since the suite was created, but no workflow ever passed
      # `--coverage`, so those thresholds had never once been evaluated —
      # a strict-looking gate that gated nothing. They are now set to the
      # measured floor (see the comment in vitest.config.ts) and enforced
      # here, so a coverage REGRESSION fails this job.
      #
      # No `continue-on-error` and no `|| true`: this must be able to turn
      # the job red, or wiring it up would just be theatre.
      #
      # The suite also fails closed on zero collection — `vitest run` with a
      # non-matching include exits 1 with "No test files found", and
      # `passWithNoTests: false` is now pinned explicitly in vitest.config.ts
      # — so a glob that silently stops matching cannot pass this step.
      - name: Run unit tests (with coverage thresholds enforced)
        run: npx vitest run --coverage

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t marketing-automation-hks-frontend:${{ github.sha }} .
